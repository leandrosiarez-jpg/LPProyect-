name: Deploy multiple projects to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build "diagramas"
        working-directory: ./projects/diagramas
        run: |
          npm install
          npm run build

      - name: Build "otro-proyecto"
        working-directory: ./projects/otro-proyecto
        run: |
          npm install
          npm run build

      - name: Combinar builds en un solo sitio
        run: |
          mkdir -p site
          cp -r projects/diagramas/dist site/diagramas
          cp -r projects/otro-proyecto/dist site/otro-proyecto
          echo '<h1>Mis proyectos</h1><ul><li><a href="diagramas/">Automatizador de diagramas</a></li><li><a href="otro-proyecto/">Otro proyecto</a></li></ul>' > site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
