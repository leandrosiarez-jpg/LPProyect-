  // ---------------- DRAWING ----------------
  function dotHatch(x,y,w,h,color,density){
    ctx.fillStyle = color;
    const n = Math.floor((w*h)*density);
    for (let i=0;i<n;i++){
      ctx.fillRect(x+Math.random()*w, y+Math.random()*h, 1, 1);
    }
  }

  function drawFloors(){
    for (const f of SCENES[currentScene].floors){
      if (f.tag==='bathroom' && day3State.bathroomGone) continue; // vanished
      if (day===7 && currentScene==='living' && day7State.collapseStage>=4) continue; // the floor is gone too — pure black
      if (f.type==='wood' || f.type==='wood2'){
        ctx.fillStyle = f.type==='wood2' ? '#5f4f3a' : '#5a4a36';
        ctx.fillRect(f.x,f.y,f.w,f.h);
        ctx.strokeStyle = 'rgba(30,22,14,0.35)'; ctx.lineWidth=1;
        for (let i=f.x;i<f.x+f.w;i+=14){ ctx.beginPath(); ctx.moveTo(i,f.y); ctx.lineTo(i,f.y+f.h); ctx.stroke(); }
        dotHatch(f.x,f.y,f.w,f.h,'rgba(20,16,10,0.25)',0.02);
      } else if (f.type==='tile'){
        ctx.fillStyle = '#485a5c';
        ctx.fillRect(f.x,f.y,f.w,f.h);
        ctx.strokeStyle = 'rgba(15,20,20,0.3)';
        for (let i=f.x;i<f.x+f.w;i+=12){ ctx.beginPath(); ctx.moveTo(i,f.y); ctx.lineTo(i,f.y+f.h); ctx.stroke(); }
        for (let j=f.y;j<f.y+f.h;j+=12){ ctx.beginPath(); ctx.moveTo(f.x,j); ctx.lineTo(f.x+f.w,j); ctx.stroke(); }
        dotHatch(f.x,f.y,f.w,f.h,'rgba(10,15,15,0.25)',0.015);
      }
    }
  }

  function drawWalls(){
    for (const s of solids){
      if (!s.isWall) continue;
      if (s.tag==='bathroom' && day3State.bathroomGone) continue; // vanished
      if (day===7 && currentScene==='living' && day7State.collapseStage>=4) continue; // walls gone — pure black
      const darkened = day===7 && currentScene==='living' && day7State.collapseStage>=1;
      ctx.fillStyle = darkened ? '#0c0b09' : '#221f19';
      ctx.fillRect(s.x,s.y,s.w,s.h);
      ctx.fillStyle = darkened ? 'rgba(120,118,100,0.08)' : 'rgba(120,118,100,0.25)';
      ctx.fillRect(s.x,s.y,s.w,1);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(s.x,s.y+s.h-1,s.w,1);
    }
  }

  function drawObjects(){
    for (const o of objects){
      if (o.tag==='bathroom' && day3State.bathroomGone) continue; // vanished
      if (o.tag==='womanNPC' && day4State.womanGone) continue; // gone for good
      if (day===7 && currentScene==='living' && collapseHides(o)) continue; // erased
      drawFurniture(o);
    }
  }

  // Day 7 only. Purely cosmetic — none of this touches collision or
  // interaction, just what the room looks like as it comes apart.
  function drawDay7Collapse(){
    if (!(day===7 && currentScene==='living')) return;
    const stage = day7State.collapseStage;
    if (stage<=0) return;

    // "Objects lose their colours" — a flat desaturating wash over
    // everything still standing, stronger as the collapse deepens.
    if (stage>=2){
      ctx.fillStyle = `rgba(35,33,30,${Math.min(0.55, 0.22+stage*0.08)})`;
      ctx.fillRect(0,0,sceneW,sceneH);
    }

    // "Textures glitch" — brief, sparse blocks of wrong colour. Never
    // covers the whole screen, just enough to feel unstable.
    if (stage>=1 && stage<4 && Math.random()<0.5){
      const glitches = 2+Math.floor(Math.random()*3);
      for (let i=0;i<glitches;i++){
        ctx.fillStyle = Math.random()<0.5 ? 'rgba(180,180,190,0.12)' : 'rgba(10,8,8,0.3)';
        ctx.fillRect(Math.random()*sceneW, Math.random()*sceneH, 4+Math.random()*18, 1+Math.random()*3);
      }
    }

    // "Shadows appear where they should not exist" — a couple of fixed
    // dark patches once the room has properly lost its identity.
    if (stage>=3){
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(sceneW*0.28, sceneH*0.55, 16, 9, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sceneW*0.72, sceneH*0.32, 12, 7, 0, 0, 7); ctx.fill();
    }
  }

  function drawFurniture(o){
    const x=o.x,y=o.y,w=o.w,h=o.h;
    switch(o.draw){
      case 'clock':
        ctx.fillStyle = '#3a4a44'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#151d1a'; ctx.fillRect(x+2,y+1,w-4,h-3);
        break;
      case 'ashtray':
        ctx.fillStyle = '#1e1c18';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7); ctx.fill();
        break;
      case 'desk':
        ctx.fillStyle = '#4a3c28'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#2f2519'; ctx.fillRect(x+2,y+2,w-4,3);
        ctx.fillStyle = '#8a8368'; ctx.fillRect(x+4,y+6,w*0.35,h*0.35);
        ctx.fillStyle = 'rgba(120,150,120,0.5)'; ctx.fillRect(x+w-10,y+6,5,8);
        break;
      case 'brokenChair':
        ctx.strokeStyle = '#4e3d26'; ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x+2,y+2); ctx.lineTo(x+w-4,y+6);
        ctx.moveTo(x+2,y+2); ctx.lineTo(x+3,y+h-2);
        ctx.moveTo(x+w-4,y+6); ctx.lineTo(x+w-6,y+h-4);
        ctx.stroke();
        break;
      case 'clothes':
        ctx.fillStyle = '#5a4658'; ctx.fillRect(x,y+6,w*0.55,h*0.5);
        ctx.fillStyle = '#3d5a56'; ctx.fillRect(x+w*0.4,y,w*0.5,h*0.6);
        ctx.fillStyle = '#6b5a34'; ctx.fillRect(x+w*0.15,y+2,w*0.4,h*0.5);
        break;
      case 'bottle':
        ctx.fillStyle = 'rgba(120,150,120,0.55)'; ctx.fillRect(x,y,w,h);
        break;
      case 'stain':
        ctx.fillStyle = 'rgba(40,35,25,0.3)';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7); ctx.fill();
        break;
      case 'doorTransition':
        ctx.fillStyle = '#463825'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#2a2015'; ctx.fillRect(x+2,y+1,w-4,h-2);
        ctx.fillStyle = 'rgba(200,175,110,0.7)';
        if (w>h) ctx.fillRect(x+w-6,y+h/2-1,2,2); else ctx.fillRect(x+w/2-1,y+h-6,2,2);
        break;
      case 'bathSink':
        ctx.fillStyle = '#5a6a68'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#24302e'; ctx.fillRect(x+3,y+2,w-6,h-4);
        break;
      case 'toilet':
        ctx.fillStyle = '#4a5654'; ctx.fillRect(x+w*0.15,y,w*0.7,h*0.4);
        ctx.fillStyle = '#5a6a68'; ctx.fillRect(x,y+h*0.4,w,h*0.6);
        break;
      case 'shower':
        ctx.strokeStyle = '#48524e'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
        ctx.fillStyle = 'rgba(110,130,110,0.25)'; ctx.fillRect(x+2,y+2,w-4,h-4);
        ctx.fillStyle = 'rgba(80,100,60,0.35)';
        ctx.beginPath(); ctx.ellipse(x+w*0.3,y+h*0.7,4,3,0,0,7); ctx.fill();
        break;
      case 'mirror':
        ctx.fillStyle = '#5f5a48'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#0c0e0e'; ctx.fillRect(x+1,y+1,w-2,h-2);
        break;
      case 'fridge':
        ctx.fillStyle = '#8f8c78'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#6c6a58'; ctx.fillRect(x+2,y+h*0.35,w-4,2);
        ctx.fillStyle = 'rgba(90,110,70,0.3)'; ctx.fillRect(x+3,y+h*0.6,w-8,h*0.25);
        break;
      case 'sink':
        ctx.fillStyle = '#6a6558'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#2c2a22'; ctx.fillRect(x+6,y+2,16,h-4);
        ctx.fillStyle = '#a39c85';
        for(let i=0;i<4;i++) ctx.fillRect(x+26+i*4, y+2+(i%2), 6, h-4-i);
        break;
      case 'trash':
        ctx.fillStyle = '#22241a';
        ctx.beginPath(); ctx.ellipse(x+w*0.3,y+h*0.6,w*0.28,h*0.4,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+w*0.65,y+h*0.5,w*0.3,h*0.45,0,0,7); ctx.fill();
        break;
      case 'pipe':
        ctx.fillStyle = '#4a5350'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = 'rgba(140,170,160,0.4)'; ctx.fillRect(x,y+h-2,w,2);
        break;
      case 'table':
        ctx.fillStyle = '#4e3d26'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#332715'; ctx.fillRect(x,y,w,3);
        ctx.fillStyle = '#18160f';
        ctx.beginPath(); ctx.arc(x+14,y+10,4,0,7); ctx.fill();
        ctx.fillStyle = '#c9c0a0';
        for(let i=0;i<5;i++) ctx.fillRect(x+11+i*1.6,y+8,1,3);
        break;
      case 'cans':
        ctx.fillStyle = '#84907c';
        for(let i=0;i<3;i++) ctx.fillRect(x+i*5,y+(i===1?2:0),4,8);
        break;
      case 'couch':
        ctx.fillStyle = '#6b3f3a'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#4a2b28'; ctx.fillRect(x,y,w,4);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x+w*0.4,y+h*0.3,w*0.2,h*0.4);
        break;
      case 'tv':
        ctx.fillStyle = '#33362f'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#0e100e'; ctx.fillRect(x+3,y+3,w-8,h-8);
        ctx.fillStyle = 'rgba(200,170,90,0.5)'; ctx.fillRect(x+w-6,y+h-5,2,2);
        // Day 2: very subtle static on the screen. No images, ever.
        if (o.staticNoise){
          ctx.fillStyle = 'rgba(180,185,175,0.12)';
          for (let i=0;i<6;i++){
            ctx.fillRect(x+4+Math.random()*(w-12), y+4+Math.random()*(h-10), 1, 1);
          }
        }
        break;
      case 'mold':
        ctx.fillStyle = 'rgba(85,105,65,0.35)';
        ctx.beginPath(); ctx.ellipse(x+w*0.4,y+h*0.4,w*0.4,h*0.35,0,0,7); ctx.fill();
        ctx.fillStyle = 'rgba(60,80,45,0.4)';
        ctx.beginPath(); ctx.ellipse(x+w*0.65,y+h*0.6,w*0.3,h*0.3,0,0,7); ctx.fill();
        break;
      case 'photo':
        ctx.fillStyle = '#4e3d26'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#141210'; ctx.fillRect(x+2,y+2,w-4,h-4);
        ctx.fillStyle = '#877050'; ctx.fillRect(x+3,y+3,3,h-6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x+7,y+3,4,h-6);
        ctx.fillRect(x+11,y+3,3,h-6);
        // Day 2: the stain has moved, one face is slightly more visible.
        // Never explained.
        if (day>=2){
          ctx.fillStyle = 'rgba(135,112,80,0.5)';
          ctx.fillRect(x+11,y+3,3,h-6);
        }
        break;
      case 'cigButt':
        ctx.fillStyle = '#c9c0a0'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#8a5a30'; ctx.fillRect(x,y,w*0.4,h);
        break;
      case 'plate':
        ctx.fillStyle = '#8f897a';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7); ctx.fill();
        ctx.fillStyle = 'rgba(60,55,40,0.4)';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w*0.3,h*0.3,0,0,7); ctx.fill();
        break;
      case 'canSingle':
        ctx.fillStyle = '#84907c'; ctx.fillRect(x,y,w,h);
        break;
      case 'key':
        // Small enough to almost miss, on purpose — a faint warm glint
        // is the only thing that makes it stand out on the floor.
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h+0.5,2.5,1,0,0,7); ctx.fill();
        ctx.strokeStyle = '#c9a84a'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x+1.5,y+3,1.6,0,7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+3,y+3); ctx.lineTo(x+w,y+3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+w-1,y+3); ctx.lineTo(x+w-1,y+5); ctx.stroke();
        ctx.fillStyle = 'rgba(255,235,180,0.4)';
        ctx.beginPath(); ctx.arc(x+1.5,y+3,2.2,0,7); ctx.fill();
        break;
      case 'lockedDoor':
        ctx.fillStyle = '#33291d'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#1a140d'; ctx.fillRect(x+1,y+2,w-2,h-4);
        ctx.fillStyle = '#5a4d34'; ctx.fillRect(x+w/2-2,y+1,4,h-2);
        break;
      case 'exitDoor':
        ctx.fillStyle = '#463825'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#2a2015'; ctx.fillRect(x+2,y+1,w-4,h-2);
        ctx.fillStyle = 'rgba(190,165,100,0.6)'; ctx.fillRect(x+w-4,y+h/2-1,2,2);
        break;
      case 'aptDoor':
        ctx.fillStyle = '#241c12'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#3c2f1e'; ctx.fillRect(x+1,y+1,w-2,h-2);
        ctx.fillStyle = '#2a2116';
        if (h>=w){
          ctx.fillRect(x+2,y+3,w-4,h*0.38);
          ctx.fillRect(x+2,y+h*0.52,w-4,h*0.36);
          ctx.fillStyle = '#7a6b47'; ctx.fillRect(x+w-4,y+h*0.5-1,2,2);
        } else {
          ctx.fillRect(x+3,y+2,w*0.4,h-4);
          ctx.fillRect(x+w*0.55,y+2,w*0.35,h-4);
          ctx.fillStyle = '#7a6b47'; ctx.fillRect(x+w*0.5-1,y+h-5,2,2);
        }
        break;
      case 'stairs':
        // A shallow landing, flush against the wall — starts exactly
        // where the wall does. Just tread lines, no arrow: which one
        // goes up and which goes down is something you learn by using it.
        ctx.fillStyle = '#332e24'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#211f18';
        for (let i=0;i<4;i++) ctx.fillRect(x+2,y+2+i*3.4,w-4,1.6);
        break;
      case 'window':
        // Dark, night-blue glass. A little warm light bleeds through
        // one pane — the only warmth in an otherwise dim hallway.
        ctx.fillStyle = '#12151d'; ctx.fillRect(x,y,w,h);
        ctx.strokeStyle = '#2a2820'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
        ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2); ctx.stroke();
        {
          const g = ctx.createRadialGradient(x+w*0.28,y+h*0.4,1,x+w*0.28,y+h*0.4,w*0.9);
          g.addColorStop(0,'rgba(225,175,105,0.4)');
          g.addColorStop(1,'rgba(225,175,105,0)');
          ctx.fillStyle = g; ctx.fillRect(x-22,y-22,w+44,h+44);
        }
        break;
      case 'rug':
        ctx.fillStyle = '#5a2a28'; ctx.fillRect(x,y,w,h);
        ctx.strokeStyle = 'rgba(20,10,10,0.4)'; ctx.lineWidth=1; ctx.strokeRect(x+1,y+1,w-2,h-2);
        ctx.fillStyle = 'rgba(90,50,45,0.5)';
        for (let i=y+6;i<y+h-4;i+=10) ctx.fillRect(x+2,i,w-4,1);
        break;
      case 'plant':
        ctx.fillStyle = '#4a3626'; ctx.fillRect(x+1,y+h-6,w-2,6);
        ctx.fillStyle = '#3d5a3a';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+4,w/2,6,0,0,7); ctx.fill();
        ctx.fillStyle = '#2e4a2c';
        ctx.beginPath(); ctx.ellipse(x+w*0.3,y+6,3,4,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+w*0.7,y+6,3,4,0,0,7); ctx.fill();
        break;
      case 'npcWoman':
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h+1,4,2,0,0,7); ctx.fill();
        ctx.fillStyle = '#2c2a30'; ctx.fillRect(x+2,y+6,w-4,h-6);
        ctx.fillStyle = '#c9b8a0'; ctx.fillRect(x+3,y+2,w-6,6);
        ctx.fillStyle = '#1c1a1a'; ctx.fillRect(x+2,y,w-4,4);
        break;
      case 'glassDoor':
        ctx.fillStyle = 'rgba(20,24,30,0.5)'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = 'rgba(40,44,50,0.5)'; ctx.fillRect(x+2,y+1,w-4,h-2);
        ctx.strokeStyle = 'rgba(150,160,150,0.4)'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
        ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+h); ctx.stroke();
        {
          const g = ctx.createRadialGradient(x+w*0.5,y+h*0.35,1,x+w*0.5,y+h*0.35,w*0.7);
          g.addColorStop(0,'rgba(220,175,110,0.3)');
          g.addColorStop(1,'rgba(220,175,110,0)');
          ctx.fillStyle = g; ctx.fillRect(x-20,y-20,w+40,h+40);
        }
        break;
      case 'mat':
        ctx.fillStyle = '#3a3126'; ctx.fillRect(x,y,w,h);
        break;
      case 'shadowPatch':
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(x,y,w,h);
        break;
      case 'floorStain':
        ctx.fillStyle = 'rgba(35,30,20,0.3)';
        ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7); ctx.fill();
        break;
      case 'cigOnFloor':
        ctx.fillStyle = '#c9c0a0'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle = '#8a5a30'; ctx.fillRect(x,y,w*0.4,h);
        break;
      case 'movedChair':
        ctx.strokeStyle = '#4e3d26'; ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x+2,y+2); ctx.lineTo(x+w-4,y+6);
        ctx.moveTo(x+2,y+2); ctx.lineTo(x+3,y+h-2);
        ctx.moveTo(x+w-4,y+6); ctx.lineTo(x+w-6,y+h-4);
        ctx.stroke();
        break;
      default:
        if (o.isBed){
          ctx.fillStyle = '#382c1e'; ctx.fillRect(x,y,w,h);
          ctx.fillStyle = '#3d5a52'; ctx.fillRect(x+2,y+8,w-4,h-10);
          ctx.fillStyle = '#8f8977'; ctx.fillRect(x+3,y+2,16,7);
        }
    }
  }

  function drawPlayer(){
    const p = player;
    const bobbing = p.moving ? Math.sin(p.animT*0.02)*1 : 0;
    const baseX = p.x - (p.spriteW-p.w)/2;
    const baseY = p.y - (p.spriteH - p.h) + bobbing;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(p.x+p.w/2, p.y+p.h+1, 5, 2, 0, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#3a4048';
    ctx.fillRect(baseX, baseY+6, p.spriteW, p.spriteH-6);
    ctx.fillStyle = '#c4b096';
    ctx.fillRect(baseX+1, baseY, p.spriteW-2, 7);
    ctx.fillStyle = '#25201a';
    ctx.fillRect(baseX+1, baseY, p.spriteW-2, 3);

    if (p.dir==='down'){
      ctx.fillStyle = '#171412';
      ctx.fillRect(baseX+3, baseY+4, 1,1);
      ctx.fillRect(baseX+6, baseY+4, 1,1);
    }
  }

  // Building lobbies read as nighttime — dim overall, with the window's
  // warm glow (drawn afterward, as an object) cutting through it. Drawn
  // before drawObjects() so doors, stairs and the window's own glow all
  // sit legibly on top of the dimming rather than under it.
  function drawNightOverlay(){
    const s = SCENES[currentScene];
    if (!s || s.lampAlpha == null) return;
    const dim = Math.max(0, Math.min(0.5, 0.62 - s.lampAlpha*0.55));
    ctx.fillStyle = `rgba(4,5,9,${dim})`;
    ctx.fillRect(0,0,sceneW,sceneH);
  }

  function drawLampGlow(){
    if (day===7 && currentScene==='living' && day7State.collapseStage>=3) return; // no lights left
    const t = performance.now()*0.001;
    let flicker = 0.03*Math.sin(t*3.1)+0.02*Math.sin(t*7.7);
    // Day 6: every so often the light dips hard for a moment, like a
    // fixture that's about to go — never enough to lose the room.
    if (day===6 && Math.sin(t*0.6) > 0.985){
      flicker -= 0.05 + Math.random()*0.03;
    }
    const cx = sceneW*0.55, cy = sceneH*0.4;
    let alpha = (SCENES[currentScene] && SCENES[currentScene].lampAlpha != null)
      ? SCENES[currentScene].lampAlpha : 1;
    if (day===7 && currentScene==='living' && day7State.collapseStage>=1){
      alpha *= (1 - day7State.collapseStage*0.3); // guttering out, stage by stage
    }
    const grad = ctx.createRadialGradient(cx,cy,4,cx,cy,Math.max(sceneW,sceneH)*0.5);
    grad.addColorStop(0, `rgba(210,175,110,${Math.max(0,(0.08+flicker)*alpha)})`);
    grad.addColorStop(1, 'rgba(210,175,110,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,sceneW,sceneH);
  }

  function drawPrompt(){
    if (day===7 && day7State.collapseStage>=1){ promptEl.style.display = 'none'; return; }
    const o = (!ended && !transitioning) ? nearestObject() : null;
    if (o){
      const c = centerOf(o);
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width / VIEW_W;
      const scaleY = rect.height / VIEW_H;
      promptEl.style.left = ((c.cx+offsetX)*scaleX) + 'px';
      promptEl.style.top = ((o.y+offsetY)*scaleY) + 'px';
      promptEl.style.display = 'block';
    } else {
      promptEl.style.display = 'none';
    }
  }

  // ---------------- MAIN LOOP ----------------
  let last = performance.now();
  function loop(now){
    const dt = now-last; last = now;
    if (!ended && !transitioning){
      let dx=0, dy=0;
      const speed = 0.055*dt;
      if (keys['arrowup']||keys['w']){ dy-=speed; player.dir='up'; }
      if (keys['arrowdown']||keys['s']){ dy+=speed; player.dir='down'; }
      if (keys['arrowleft']||keys['a']){ dx-=speed; player.dir='left'; }
      if (keys['arrowright']||keys['d']){ dx+=speed; player.dir='right'; }
      player.moving = (dx!==0||dy!==0);
      if (player.moving) player.animT += dt;
      if (dx!==0 && dy!==0){ dx*=0.7071; dy*=0.7071; }
      tryMove(dx,dy);
      checkLocationChange();
    }

    ctx.fillStyle = '#0b0c0b';
    ctx.fillRect(0,0,VIEW_W,VIEW_H);

    // Day 5: an extremely subtle, purely mechanical screen shake during
    // the panic-attack portion of the sofa sequence. Zero on every other
    // day and zero outside that window.
    let shakeX = 0, shakeY = 0;
    if (day===5 && day5State.shakeAmount > 0){
      shakeX = (Math.random()-0.5) * day5State.shakeAmount;
      shakeY = (Math.random()-0.5) * day5State.shakeAmount;
    }

    ctx.save();
    ctx.translate(offsetX+shakeX, offsetY+shakeY);
    drawFloors();
    drawWalls();
    drawNightOverlay();
    drawObjects();
    drawDay7Collapse();
    drawPlayer();
    drawLampGlow();
    ctx.restore();

    // Day 3: the hallway loop slowly swallows the light. Stays even
    // after the loop mechanic itself stops (e.g. during the breakdown).
    if (day===3 && day3State.darkness > 0){
      ctx.fillStyle = `rgba(0,0,0,${day3State.darkness})`;
      ctx.fillRect(0,0,VIEW_W,VIEW_H);
    }

    // Day 5: a slight additional vignette darkening that grows with the
    // panic attack. No flashing, no color shifts — a plain, slow darkening.
    if (day===5 && day5State.vignetteExtra > 0){
      const g = ctx.createRadialGradient(VIEW_W/2,VIEW_H/2,10,VIEW_W/2,VIEW_H/2,VIEW_W*0.62);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(1,`rgba(0,0,0,${day5State.vignetteExtra})`);
      ctx.fillStyle = g;
      ctx.fillRect(0,0,VIEW_W,VIEW_H);
    }

    drawPrompt();

    requestAnimationFrame(loop);
  }

  // ---------------- AMBIENT AUDIO ----------------
  let actx = null;
  let masterGain = null;

  function createNoiseBuffer(duration=2){
    const bufferSize = actx.sampleRate*duration;
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
    return buffer;
  }

  function startAmbience(){
    actx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.0;
    masterGain.connect(actx.destination);
    masterGain.gain.linearRampToValueAtTime(0.55, actx.currentTime+2.5);

    const hum = actx.createOscillator();
    hum.type='sine'; hum.frequency.value=82;
    const humGain = actx.createGain(); humGain.gain.value=0.05;
    const humLFO = actx.createOscillator(); humLFO.frequency.value=6.5;
    const humLFOGain = actx.createGain(); humLFOGain.gain.value=0.012;
    humLFO.connect(humLFOGain); humLFOGain.connect(humGain.gain);
    hum.connect(humGain); humGain.connect(masterGain);
    hum.start(); humLFO.start();

    const trafficSrc = actx.createBufferSource();
    trafficSrc.buffer = createNoiseBuffer(4); trafficSrc.loop=true;
    const trafficFilter = actx.createBiquadFilter();
    trafficFilter.type='bandpass'; trafficFilter.frequency.value=350; trafficFilter.Q.value=0.6;
    const trafficGain = actx.createGain(); trafficGain.gain.value=0.035;
    trafficSrc.connect(trafficFilter); trafficFilter.connect(trafficGain); trafficGain.connect(masterGain);
    trafficSrc.start();

    const windSrc = actx.createBufferSource();
    windSrc.buffer = createNoiseBuffer(4); windSrc.loop=true;
    const windFilter = actx.createBiquadFilter();
    windFilter.type='bandpass'; windFilter.frequency.value=1200; windFilter.Q.value=0.5;
    const windGain = actx.createGain(); windGain.gain.value=0.02;
    const windLFO = actx.createOscillator(); windLFO.frequency.value=0.07;
    const windLFOGain = actx.createGain(); windLFOGain.gain.value=0.015;
    windLFO.connect(windLFOGain); windLFOGain.connect(windGain.gain);
    windSrc.connect(windFilter); windFilter.connect(windGain); windGain.connect(masterGain);
    windSrc.start(); windLFO.start();

    scheduleDrip();
    scheduleFootsteps();
    schedulePipeCreak();
  }

  function scheduleDrip(){
    if (ended) return;
    const delay = 3500 + Math.random()*5500;
    setTimeout(()=>{
      if (!actx || ended) return;
      const o = actx.createOscillator();
      o.type='sine'; o.frequency.value=1400;
      const g = actx.createGain(); g.gain.value=0.0;
      o.connect(g); g.connect(masterGain);
      const t = actx.currentTime;
      g.gain.linearRampToValueAtTime(0.09, t+0.005);
      o.frequency.exponentialRampToValueAtTime(700, t+0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
      o.start(t); o.stop(t+0.18);
      scheduleDrip();
    }, delay);
  }

  function scheduleFootsteps(){
    if (ended) return;
    const delay = 7000 + Math.random()*9000;
    setTimeout(()=>{
      if (!actx || ended) return;
      const steps = 2+Math.floor(Math.random()*3);
      for (let i=0;i<steps;i++){
        setTimeout(()=>{
          if (!actx || ended) return;
          const src = actx.createBufferSource();
          src.buffer = createNoiseBuffer(0.3);
          const filter = actx.createBiquadFilter();
          filter.type='lowpass'; filter.frequency.value=180;
          const g = actx.createGain(); g.gain.value=0.0;
          src.connect(filter); filter.connect(g); g.connect(masterGain);
          const t = actx.currentTime;
          g.gain.linearRampToValueAtTime(0.06, t+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
          src.start(t); src.stop(t+0.2);
        }, i*380);
      }
      scheduleFootsteps();
    }, delay);
  }

  function schedulePipeCreak(){
    if (ended) return;
    const delay = 9000 + Math.random()*11000;
    setTimeout(()=>{
      if (!actx || ended) return;
      const o = actx.createOscillator();
      o.type='triangle'; o.frequency.value=520+Math.random()*80;
      const filter = actx.createBiquadFilter();
      filter.type='bandpass'; filter.frequency.value=700; filter.Q.value=4;
      const g = actx.createGain(); g.gain.value=0.0;
      o.connect(filter); filter.connect(g); g.connect(masterGain);
      const t = actx.currentTime;
      g.gain.linearRampToValueAtTime(0.045, t+0.05);
      o.frequency.exponentialRampToValueAtTime(o.frequency.value*0.7, t+0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.8);
      o.start(t); o.stop(t+0.9);
      schedulePipeCreak();
    }, delay);
  }

  // Day 6 only: a faint, unplaceable noise from somewhere in the
  // building — never the same twice, never explained, never repeated
  // often enough to feel like a pattern.
  function scheduleDistantNoise(){
    if (ended || day!==6) return;
    const delay = 14000 + Math.random()*16000;
    setTimeout(()=>{
      if (!actx || ended || day!==6) return;
      const src = actx.createBufferSource();
      src.buffer = createNoiseBuffer(0.5);
      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 220 + Math.random()*120;
      const g = actx.createGain(); g.gain.value = 0;
      src.connect(filter); filter.connect(g); g.connect(masterGain);
      const t = actx.currentTime;
      g.gain.linearRampToValueAtTime(0.05, t+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
      src.start(t); src.stop(t+0.55);
      scheduleDistantNoise();
    }, delay);
  }

  function fadeAudioOut(){
    if (!actx || !masterGain) return;
    masterGain.gain.linearRampToValueAtTime(0, actx.currentTime+4);
  }

  // Brings ambience back up for Day 2 and restarts the one-shot sound
  // chains (drip / footsteps / pipes), which stop rescheduling themselves
  // once `ended` is true.
  function resumeAmbience(){
    if (!actx || !masterGain) return;
    masterGain.gain.cancelScheduledValues(actx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, actx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.55, actx.currentTime+2.5);
    scheduleDrip();
    scheduleFootsteps();
    schedulePipeCreak();
    scheduleDistantNoise(); // self-gates to Day 6 only
  }

  // ---------------- START ----------------
  loadScene('bedroom', 25, 30, 'down');

  document.getElementById('startOverlay').addEventListener('click', function startHandler(){
    startAmbience();
    this.style.transition = 'opacity 1s ease';
    this.style.opacity = '0';
    setTimeout(()=>{ this.style.display='none'; }, 1000);
    this.removeEventListener('click', startHandler);
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
